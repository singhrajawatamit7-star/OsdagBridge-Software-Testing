name: OsdagBridge QA Automated Testing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa-suite:
    name: Pytest CI on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout QA Testing Repository
        uses: actions/checkout@v4
        with:
          path: OsdagBridge-Software-Testing

      - name: Checkout Official OsdagBridge Application
        uses: actions/checkout@v4
        with:
          repository: osdag-admin/OsdagBridge
          path: OsdagBridge

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Official OsdagBridge Application
        working-directory: OsdagBridge
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install QA Suite Dependencies
        working-directory: OsdagBridge-Software-Testing
        run: |
          pip install -r requirements.txt

      - name: Run Full QA Pytest Suite
        working-directory: OsdagBridge-Software-Testing
        env:
          OSDAGBRIDGE_ROOT: ${{ github.workspace }}/OsdagBridge
          OSDAGBRIDGE_SRC: ${{ github.workspace }}/OsdagBridge/src
        run: |
          python run_tests.py

      - name: Generate Code Coverage and HTML Test Report
        working-directory: OsdagBridge-Software-Testing
        if: always()
        env:
          OSDAGBRIDGE_ROOT: ${{ github.workspace }}/OsdagBridge
          OSDAGBRIDGE_SRC: ${{ github.workspace }}/OsdagBridge/src
        run: |
          python -m pytest --html=reports/test_results/test_report.html --self-contained-html || true

      - name: Upload QA Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            OsdagBridge-Software-Testing/reports/
            OsdagBridge-Software-Testing/test_results.csv
            OsdagBridge-Software-Testing/issues.csv
