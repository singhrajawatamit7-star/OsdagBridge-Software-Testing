[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra
markers =
    unit: Tests for individual QA utility functions
    integration: Tests that interact with official OsdagBridge
    gui: Tests that interact with the actual desktop GUI
    simulation: Tests that simulate UI behaviour without launching the GUI
    regression: Tests for previously reported defects
    smoke: Basic application installation and startup checks
    benchmark: Tests using independently verified reference values
