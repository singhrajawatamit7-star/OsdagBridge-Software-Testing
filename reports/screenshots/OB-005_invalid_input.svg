<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#f4f6f9" rx="8"/>
  <rect x="0" y="0" width="900" height="55" fill="#0e2a47" rx="8 8 0 0"/>
  <circle cx="25" cy="27" r="6" fill="#e74c3c"/>
  <circle cx="45" cy="27" r="6" fill="#f1c40f"/>
  <circle cx="65" cy="27" r="6" fill="#2ecc71"/>
  <text x="100" y="34" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="18">OsdagBridge - Girder Section Dimensions (Error State)</text>

  <!-- Error Notification Banner -->
  <rect x="30" y="75" width="840" height="50" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5" rx="4"/>
  <text x="50" y="106" fill="#c5221f" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">⚠️ Validation Error [ERR_INVALID_DATA_TYPE]: Field 'Web Depth' must be a positive numeric value in millimeters.</text>

  <!-- Input Form Container -->
  <rect x="30" y="145" width="840" height="340" fill="#ffffff" rx="6" filter="url(#shadow)"/>
  <text x="60" y="180" fill="#202124" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">Plate Girder Section Inputs</text>

  <!-- Field 1: Span -->
  <text x="60" y="220" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="13">Span Length (m) *</text>
  <rect x="60" y="230" width="350" height="38" fill="#ffffff" stroke="#dadce0" rx="4"/>
  <text x="75" y="255" fill="#202124" font-family="Segoe UI, sans-serif" font-size="14">24.0</text>

  <!-- Field 2: Web Depth (ERROR FIELD) -->
  <text x="470" y="220" fill="#c5221f" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Web Depth (mm) * [INVALID CHARACTERS]</text>
  <rect x="470" y="230" width="350" height="38" fill="#fff" stroke="#d93025" stroke-width="2" rx="4"/>
  <text x="485" y="255" fill="#d93025" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">ABC123DEPTH</text>
  <text x="470" y="285" fill="#d93025" font-family="Segoe UI, sans-serif" font-size="12">✖ Non-numeric characters detected. Please enter numeric digits only.</text>

  <!-- Field 3: Web Thickness -->
  <text x="60" y="320" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="13">Web Thickness (mm) *</text>
  <rect x="60" y="330" width="350" height="38" fill="#ffffff" stroke="#dadce0" rx="4"/>
  <text x="75" y="355" fill="#202124" font-family="Segoe UI, sans-serif" font-size="14">14.0</text>

  <!-- Field 4: Flange Width -->
  <text x="470" y="320" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="13">Flange Width (mm) *</text>
  <rect x="470" y="330" width="350" height="38" fill="#ffffff" stroke="#dadce0" rx="4"/>
  <text x="485" y="355" fill="#202124" font-family="Segoe UI, sans-serif" font-size="14">500.0</text>

  <!-- Buttons -->
  <rect x="60" y="415" width="160" height="42" fill="#dadce0" rx="4"/>
  <text x="100" y="442" fill="#70757a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Run Design 🔒</text>
  <text x="240" y="442" fill="#d93025" font-family="Segoe UI, sans-serif" font-size="13">Execution blocked until validation issues are resolved.</text>
</svg>
