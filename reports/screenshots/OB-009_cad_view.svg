<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <rect x="0" y="0" width="900" height="520" fill="#1e1e1e" rx="8"/>
  <rect x="0" y="0" width="900" height="45" fill="#2d2d2d" rx="8 8 0 0"/>
  <text x="25" y="28" fill="#d4d4d4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">OsdagBridge 3D CAD Visualization Canvas (Plate Girder Bridge - Span: 24m)</text>
  
  <!-- Coordinate Axis -->
  <g transform="translate(60, 440)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#e74c3c" stroke-width="2"/>
    <text x="45" y="4" fill="#e74c3c" font-size="11" font-weight="bold">X (Span)</text>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#2ecc71" stroke-width="2"/>
    <text x="-5" y="-45" fill="#2ecc71" font-size="11" font-weight="bold">Y (Height)</text>
    <line x1="0" y1="0" x2="-25" y2="25" stroke="#3498db" stroke-width="2"/>
    <text x="-40" y="38" fill="#3498db" font-size="11" font-weight="bold">Z (Width)</text>
  </g>

  <!-- 3D Bridge Wireframe Perspective -->
  <!-- Concrete Deck Slab -->
  <polygon points="180,180 720,180 840,260 300,260" fill="#7f8c8d" fill-opacity="0.6" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="490" y="225" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Reinforced Concrete Deck Slab (220mm)</text>

  <!-- Girder 1 (Left) -->
  <!-- Top Flange -->
  <polygon points="220,195 680,195 720,225 260,225" fill="#2980b9" stroke="#1f618d" stroke-width="1.2"/>
  <!-- Web plate -->
  <polygon points="260,225 720,225 720,335 260,335" fill="#3498db" fill-opacity="0.8" stroke="#1f618d" stroke-width="1.2"/>
  <!-- Bottom Flange -->
  <polygon points="220,335 680,335 720,365 260,365" fill="#2980b9" stroke="#1f618d" stroke-width="1.2"/>

  <!-- Girder 2 (Center) -->
  <polygon points="340,215 760,215 790,245 370,245" fill="#2471a3" stroke="#1b4f72" stroke-width="1.2"/>
  <polygon points="370,245 790,245 790,355 370,355" fill="#2980b9" fill-opacity="0.8" stroke="#1b4f72" stroke-width="1.2"/>
  <polygon points="340,355 760,355 790,385 370,385" fill="#2471a3" stroke="#1b4f72" stroke-width="1.2"/>

  <!-- Girder 3 (Right) -->
  <polygon points="440,235 830,235 850,260 460,260" fill="#1b4f72" stroke="#154360" stroke-width="1.2"/>
  <polygon points="460,260 850,260 850,370 460,370" fill="#2471a3" fill-opacity="0.8" stroke="#154360" stroke-width="1.2"/>
  <polygon points="440,370 830,370 850,395 460,395" fill="#1b4f72" stroke="#154360" stroke-width="1.2"/>

  <!-- Cross Bracing & Stiffeners -->
  <line x1="260" y1="280" x2="370" y2="300" stroke="#f39c12" stroke-width="2.5"/>
  <line x1="260" y1="300" x2="370" y2="280" stroke="#f39c12" stroke-width="2.5"/>
  <line x1="450" y1="280" x2="560" y2="300" stroke="#f39c12" stroke-width="2.5"/>
  <line x1="450" y1="300" x2="560" y2="280" stroke="#f39c12" stroke-width="2.5"/>

  <!-- Stiffeners vertical lines -->
  <line x1="330" y1="225" x2="330" y2="335" stroke="#f1c40f" stroke-width="2"/>
  <line x1="420" y1="225" x2="420" y2="335" stroke="#f1c40f" stroke-width="2"/>
  <line x1="510" y1="225" x2="510" y2="335" stroke="#f1c40f" stroke-width="2"/>
  <line x1="600" y1="225" x2="600" y2="335" stroke="#f1c40f" stroke-width="2"/>

  <!-- Status HUD overlay -->
  <rect x="680" y="60" width="200" height="90" fill="#000000" fill-opacity="0.6" rx="4"/>
  <text x="695" y="85" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">CAMERA: Isometric</text>
  <text x="695" y="105" fill="#2ecc71" font-family="Segoe UI, sans-serif" font-size="12">FPS: 60.0 | MESH: OK</text>
  <text x="695" y="125" fill="#f1c40f" font-family="Segoe UI, sans-serif" font-size="12">ELEMENTS: 3 Girders, 14 Stiffeners</text>
</svg>
